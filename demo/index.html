<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midgard Hex Grid</title>
  </head>
  <body>
    <main class="page">
      <article class="sheet">
        <div id="theory" class="sheet-section">
          <header class="sheet__intro">
            <h1>Midgard Hex Grid</h1>
          </header>
        </div>
        <div id="x-dominated" class="sheet-section">
          <div class="diagrams">
            <section class="diagram">
              <h2>In the X-dominated grid</h2>
              <div id="xdom" class="stage"></div>
            </section>
            <section class="diagram">
              <h2>Y-movement is not allowed</h2>
              <div id="x-hexgrid" class="stage"></div>
            </section>
          </div>
        </div>
        <div id="y-dominated" class="sheet-section">
          <div class="diagrams">
            <section class="diagram">
              <h2>In the Y-dominated grid</h2>
              <div id="ydom" class="stage"></div>
            </section>
            <section class="diagram">
              <h2>X-movement is not allowed</h2>
              <div id="y-hexgrid" class="stage"></div>
            </section>
          </div>
        </div>
      </article>
    </main>
    <script type="module" src="/demo-theory.ts"></script>
  </body>
</html>
